apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- storageclass.yaml
- alloy-rbac.yaml
- networkpolicies.yaml
- grafana-datasource.yaml
- alerts.yaml
configMapGenerator:
- name: alloy-config
  namespace: logging
  files:
  - config.alloy
- name: cluster-logging-dashboard
  namespace: cattle-monitoring-system
  files:
  - logs-dashboard.json
  options:
    labels:
      grafana_dashboard: '1'
generatorOptions:
  disableNameSuffixHash: true
