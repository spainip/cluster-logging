apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-logging-datasource
  namespace: cattle-monitoring-system
  labels:
    grafana_datasource: '1'
data:
  loki.yaml: "apiVersion: 1\ndatasources:\n- name: Loki\n  uid: loki\n  type: loki\n\
    \  access: proxy\n  url: http://loki.logging.svc.cluster.local:3100\n  isDefault:\
    \ false\n  editable: false\n  jsonData:\n    maxLines: 1000\n"
