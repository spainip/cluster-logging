fullnameOverride: alloy
crds:
  create: false
image:
  tag: v1.21.3
  digest: sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
alloy:
  enableReporting: false
  storagePath: /var/lib/alloy
  extraEnv:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: LOG_NAMESPACE_FILTER
    value: .+
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  mounts:
    extra:
    - name: pod-logs
      mountPath: /var/log/pods
      readOnly: true
    - name: journal-persistent
      mountPath: /var/log/journal
      readOnly: true
    - name: journal-runtime
      mountPath: /run/log/journal
      readOnly: true
    - name: machine-id
      mountPath: /etc/machine-id
      readOnly: true
    - name: positions
      mountPath: /var/lib/alloy
  stabilityLevel: experimental
controller:
  type: daemonset
  nodeSelector:
    kubernetes.io/hostname: spainip-k3s
  terminationGracePeriodSeconds: 60
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  volumes:
    extra:
    - name: pod-logs
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: journal-persistent
      hostPath:
        path: /var/log/journal
        type: DirectoryOrCreate
    - name: journal-runtime
      hostPath:
        path: /run/log/journal
        type: DirectoryOrCreate
    - name: machine-id
      hostPath:
        path: /etc/machine-id
        type: File
    - name: positions
      hostPath:
        path: /var/lib/alloy-logging
        type: DirectoryOrCreate
rbac:
  create: false
serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels:
    release: kube-prometheus-stack
configReloader:
  enabled: false
